<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ココAI デザイン案</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap">
<style>
/* Layout: one narrow column; a short intro, then one card per design direction. */
:root{
  --page:#F6F1EE; --surface:#FFFFFF; --line:#EEE5E0; --line-strong:#DCD0C9;
  --ink:#231815; --ink-2:#5B504A; --ink-3:#766A63; --accent:#C8301E;
  --font:'Plus Jakarta Sans','Noto Sans JP','Hiragino Sans','Yu Gothic UI',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{--page:#121011;--surface:#1F1A1B;--line:#352D2E;--line-strong:#4A4041;--ink:#F6EFEB;--ink-2:#CDC1BB;--ink-3:#A3978F;--accent:#FF8E7D;color-scheme:dark}
}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;padding:56px 20px 64px;display:flex;flex-direction:column;gap:32px}
header{display:flex;flex-direction:column;gap:8px}
h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.01em}
header p{margin:0;font-size:15px;line-height:1.8;color:var(--ink-2)}
.list{display:grid;gap:12px}
.card{display:flex;align-items:center;gap:16px;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:20px;color:inherit;text-decoration:none;transition:border-color .15s,transform .2s}
.card:hover{border-color:var(--line-strong);transform:translateY(-1px)}
.card:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.letter{flex:none;width:52px;height:52px;border-radius:16px;background:var(--page);display:grid;place-items:center;font-size:22px;font-weight:800}
.body{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.body b{font-size:16px;font-weight:700}
.body span{font-size:13.5px;line-height:1.7;color:var(--ink-3)}
.open{flex:none;font-size:14px;font-weight:700;color:var(--accent)}
.note{margin:0;font-size:13px;line-height:1.7;color:var(--ink-3)}
</style>
</head>
<body>
<main>
  <header>
    <h1>ココAI デザイン案</h1>
    <p>KokoMartのお買い物アシスタント「ココAI」のチャット画面の案です。各案を開き、右下のボタンからチャットを試してください。商品・価格はすべてサンプルです。</p>
  </header>
  <div class="list">
    <a class="card" href="direction-a/">
      <span class="letter" aria-hidden="true">A</span>
      <span class="body">
        <b>案A：白基調・やわらかいグロー</b>
        <span>ヘッダーなし、丸いフローティングボタン。選択式の質問とシンプルなセットカード。</span>
      </span>
      <span class="open" aria-hidden="true">開く →</span>
    </a>
  </div>
  <p class="note">ほかの案は追加しだい、ここに並びます。</p>
</main>
</body>
</html>
